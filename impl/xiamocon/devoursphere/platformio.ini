; Devour Sphere for Xiamocon on XIAO ESP32S3. See ../SPEC.md.
;
;   source ~/repo/2026/xiamocon/setup.shrc
;   cd impl/xiamocon/devoursphere
;   xmc run -p esp32s3_pio_arduino -s /dev/ttyACM0
;
; The RP2350 target is the CMakeLists.txt next to this file; the two share
; every source. Run `xmc` with -p, or it builds both.

[platformio]
default_envs = esp32s3_arduino

[env:esp32s3_arduino]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3

lib_deps =
    ${sysenv.XMC_REPO_PATH}/cpp/library
    ${sysenv.XMC_REPO_PATH}/cpp/platform/decl/
    ${sysenv.XMC_REPO_PATH}/cpp/platform/impl/esp32s3_pio_arduino/
    ../../../submodule/shapo-gfx
    ../../../core

build_unflags =
    -std=gnu++11
    -std=gnu++0x
    -Os
    -fno-jump-tables
    -fno-tree-switch-conversion

build_flags =
    -std=gnu++17
    -O2
    -fjump-tables
    -ftree-switch-conversion
    ; Only RGB565BE is ever drawn; the rest is dead code in the blitters and
    ; the span writers
    -DSHAPOGFX_FORMAT_GRAY1=0
    -DSHAPOGFX_FORMAT_RGB444=0
    -DSHAPOGFX_FORMAT_ARGB4444=0
    -DSHAPOGFX_FORMAT_RGB565BE=1
    ; The FUNC-toggled timing overlay; 0 compiles it out
    -DDS_PROFILE=1
    ; 30 Hz, as the RP2350 needed while one core did everything. Measured on
    ; the board at 60 Hz: a tick costs 9.6 ms and the frame was spending
    ; 38.2 ms of its 71 ms on four of them, pinned at the catch-up cap.
    -DDEVOURSPHERE_TICK_RATE=30
    -Iinclude

build_src_filter =
    +<*>
